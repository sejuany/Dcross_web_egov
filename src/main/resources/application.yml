server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.dacos: INFO
    # 인증 응답의 access token이 Spring MVC DEBUG 로그에 노출되지 않게 한다.
    org.springframework.web: INFO
  charset:
    console: UTF-8
    file: UTF-8

spring:
  profiles:
    # 프로필을 지정하지 않은 개발 PC에서만 local을 사용한다!
    # 운영은 --spring.profiles.active=real로 실행하므로 local 설정이 섞이지 않음
    default: local

  threads:
    virtual:
      enabled: true # Java 21 가상 스레드 (성능 향상)

  servlet:
    multipart:
      max-file-size: 20MB    # 업로드 파일 최대 크기
      max-request-size: 50MB # 요청 전체(여러 파일 포함) 최대 크기

  # 프로필별 파일 또는 환경변수에서 실제 DB 값을 덮어쓴다.
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/orcl}
    username: ${DB_USERNAME:YOUR_DB_USERNAME}
    password: ${DB_PASSWORD:YOUR_DB_PASSWORD}

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:DacosSecretKey!@#}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false # DB 컬럼명 그대로 사용 (기존 프론트와 호환)
    default-fetch-size: 100
    default-statement-timeout: 30
    jdbc-type-for-null: VARCHAR # Oracle null 파라미터 타입 오류 방지 (ORA-17004)

newcar:
  pdf-upload-dir: ${NEWCAR_PDF_UPLOAD_DIR:./uploads/newcar-production-certificates}
mobile-ok:
  enabled: true
  key-password: ${MOBILE_OK_KEY_PASSWORD:@dewa1004}
  client-tx-id-prefix: ${MOBILE_OK_CLIENT_TX_ID_PREFIX:Dacos309}
  site-url: ${MOBILE_OK_SITE_URL:t.dcross.kr}

  token-url: ${MOBILE_OK_TOKEN_URL:https://scert-dir.mobile-ok.com/agent/v1/token/get}
  auth-request-url: ${MOBILE_OK_AUTH_REQUEST_URL:https://scert-dir.mobile-ok.com/agent/v1/auth/request}
  confirm-url: ${MOBILE_OK_CONFIRM_URL:https://scert-dir.mobile-ok.com/agent/v1/confirm/request}

numplate:
  passkey:
    rp-id: ${NUMPLATE_PASSKEY_RP_ID:web.dcross.kr}
    origin: ${NUMPLATE_PASSKEY_ORIGIN:https://web.dcross.kr}

firebase:
  push:
    enabled: ${FIREBASE_PUSH_ENABLED:true}
    credentials: ${FIREBASE_CREDENTIALS:C:/GoogleFirebase/dcross-no-dcrossWeb.json}
    project-id: ${FIREBASE_PROJECT_ID:dcross-no}
    public-base-url: ${FIREBASE_PUBLIC_BASE_URL:https://web.dcross.kr}
    # 이전 Java 7 프로젝트와 동일한 임의의 긴 값을 환경변수로 설정한다.
    internal-api-key: ${NUMPLATE_PUSH_API_KEY:}
